# Requer a plataforma local do repositório Terraform no ar (rede "bigdata") e o
# platform/local.env gerado pelo terraform apply de lá.
name: bigdata-ingestion

services:
  ingestion:
    build:
      context: .
      target: runtime
      args:
        # Commit gravado na imagem; scripts/platform.sh do repositório Terraform preenche.
        GIT_SHA: ${GIT_SHA:-dev}
    # Nome fixo: o Airflow local executa esta imagem via DockerOperator.
    image: bigdata-ingestion:local
    # Buckets, LocalStack e Trino vêm do contrato da plataforma, sem cópia local.
    env_file:
      - path: ${BIGDATA_PLATFORM_DIR:-../Terraform/platform}/local.env
        required: false
      # Chaves de API (fora do git); modelo em platform/secrets.env.example.
      - path: ${BIGDATA_PLATFORM_DIR:-../Terraform/platform}/secrets.env
        required: false
    networks: [bigdata]

  tests:
    build:
      context: .
      target: test
    profiles: ["tools"]
    network_mode: none

networks:
  bigdata:
    external: true
