name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Mesmo comando do README: ruff + pytest, sem rede.
      - name: Lint e testes
        run: docker compose run --rm --build tests
