[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigdata-ingestion"
version = "0.1.0"
description = "Ingestão de fontes externas para a camada bronze (Parquet no S3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "awswrangler>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "trino>=0.330",
]

[project.optional-dependencies]
dev = [
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
ingestion = "ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
